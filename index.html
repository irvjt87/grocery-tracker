<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='68%' font-size='60' text-anchor='middle'>🛍️</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50%' y='68%' font-size='60' text-anchor='middle'>🛍️</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grocery Tracker">
  <title>Household Grocery Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --green: #16a34a;
      --yellow: #d97706;
      --red: #dc2626;
      --radius: 12px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 16px; 
      padding-bottom: max(60px, env(safe-area-inset-bottom)); 
      max-width: 900px; 
      margin: 0 auto; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 12px; 
      margin-bottom: 16px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--card-border); 
    }
    
    .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }

    .funds-container { 
      display: flex; 
      align-items: center; 
      background: #0f172a; 
      border: 1px solid var(--card-border); 
      border-radius: 8px; 
      padding: 6px 10px; 
      gap: 6px; 
    }
    .funds-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .funds-symbol { color: #60a5fa; font-weight: 700; font-size: 1rem; }
    
    input, select, button {
      font-size: 16px; 
      -webkit-appearance: none;
      appearance: none;
    }

    .funds-input { 
      background: transparent; 
      border: none; 
      color: #60a5fa; 
      font-size: 1.1rem; 
      font-weight: 700; 
      width: 85px; 
      outline: none; 
    }

    .btn-add { 
      background: var(--accent-blue); 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 0.95rem; 
      cursor: pointer; 
    }

    .search-bar {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: white;
      margin-bottom: 20px;
      outline: none;
    }

    /* Add Item Panel */
    .add-panel { 
      background: var(--card-bg); 
      border: 1px solid var(--accent-blue); 
      border-radius: var(--radius); 
      padding: 16px; 
      margin-bottom: 20px; 
      display: none; 
    }
    .add-panel.open { display: block; }
    .add-panel h2 { font-size: 1rem; margin-bottom: 12px; color: var(--text-main); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input { 
      width: 100%; 
      padding: 10px; 
      border-radius: 6px; 
      border: 1px solid var(--card-border); 
      background: #0f172a; 
      color: white; 
    }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-cancel { 
      background: transparent; 
      border: 1px solid var(--card-border); 
      color: var(--text-muted); 
      padding: 8px 14px; 
      border-radius: 6px; 
      font-weight: 600; 
      cursor: pointer; 
    }

    /* Inventory Grid */
    .section-title { font-size: 1rem; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
      gap: 12px; 
      margin-bottom: 32px; 
    }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: var(--radius); 
      padding: 14px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      gap: 12px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .item-title-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    
    /* Bin/Location Inline Input */
    .bin-input {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #60a5fa;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 6px;
      border-radius: 6px;
      width: 60px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }
    .bin-input:focus {
      border-color: var(--accent-blue);
    }

    .item-name { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
    .item-store { font-size: 0.75rem; color: #60a5fa; background: #1e3a8a; padding: 2px 8px; border-radius: 12px; display: inline-block; }
    .btn-delete { background: none; border: none; color: #64748b; font-size: 1.2rem; cursor: pointer; padding: 0 4px; }

    /* Status Controls */
    .status-group { display: flex; background: #0f172a; padding: 3px; border-radius: 8px; gap: 2px; }
    .status-btn { 
      flex: 1; 
      border: none; 
      background: transparent; 
      color: var(--text-muted); 
      padding: 10px 0; 
      font-size: 0.8rem; 
      font-weight: 600; 
      border-radius: 6px; 
      cursor: pointer; 
      text-align: center; 
    }
    .status-btn.selected-plenty { background: var(--green); color: white; }
    .status-btn.selected-soon { background: var(--yellow); color: white; }
    .status-btn.selected-out { background: var(--red); color: white; }

    /* Shopping List & Budget Summary */
    .shopping-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; }
    
    .budget-summary-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #0f172a; 
      border: 1px solid var(--card-border); 
      padding: 12px; 
      border-radius: 8px; 
      margin-bottom: 16px; 
      flex-wrap: wrap; 
      gap: 8px; 
    }
    .summary-item { display: flex; flex-direction: column; }
    .summary-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .summary-val { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .buffer-positive { color: #4ade80; }
    .buffer-negative { color: #f87171; }

    .vendor-group { margin-bottom: 16px; }
    .vendor-group:last-child { margin-bottom: 0; }
    .vendor-title { font-size: 0.95rem; font-weight: 700; color: #60a5fa; margin-bottom: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 4px; }
    .shop-list { list-style: none; }
    .shop-item { 
      display: flex; 
      align-items: center; 
      padding: 10px 0; 
      border-bottom: 1px solid #1e293b; 
      gap: 8px; 
      flex-wrap: wrap; 
    }
    .shop-item:last-child { border-bottom: none; }
    .shop-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-blue); }
    .shop-item-name { font-size: 0.95rem; flex: 1; min-width: 130px; }
    
    .price-calc-group { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      background: #0f172a; 
      padding: 4px 8px; 
      border-radius: 6px; 
      border: 1px solid var(--card-border); 
    }
    .calc-label { font-size: 0.75rem; color: var(--text-muted); }
    .num-input { 
      background: transparent; 
      border: none; 
      color: white; 
      font-weight: 600; 
      width: 45px; 
      outline: none; 
      text-align: center; 
    }
    .num-input-price { width: 60px; text-align: right; }

    .badge { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .badge-soon { background: rgba(217, 119, 6, 0.2); color: var(--yellow); }
    .badge-out { background: rgba(220, 38, 38, 0.2); color: var(--red); }
    .empty-list { color: var(--text-muted); font-style: italic; font-size: 0.9rem; padding: 8px 0; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Grocery Tracker</h1>
      <div class="funds-container">
        <span class="funds-label">Budget:</span>
        <span class="funds-symbol">$</span>
        <input type="number" id="totalFunds" class="funds-input" value="250" step="10" oninput="saveFunds()">
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-cancel" onclick="exportData()">Export</button>
      <button class="btn-cancel" onclick="importData()">Import</button>
      <button class="btn-add" onclick="toggleAddPanel()">+ Add Item</button>
    </div>
  </header>

  <div class="add-panel" id="addPanel">
    <h2>Add New Household Item</h2>
    <div class="form-group">
      <label for="newItemBin">Bin / Location (Optional)</label>
      <input type="text" id="newItemBin" placeholder="e.g. A14, Fridge, Pantry-1">
    </div>
    <div class="form-group">
      <label for="newItemName">Item Name</label>
      <input type="text" id="newItemName" placeholder="e.g. Whole Milk, Eggs, Flaxseed">
    </div>
    <div class="form-group">
      <label for="newItemStore">Store / Source</label>
      <input type="text" id="newItemStore" placeholder="e.g. Walmart, Dutch Country, Save A Lot" list="defaultStores">
      <datalist id="defaultStores">
        <option value="Marks Meat Processing">
        <option value="Dutch Country">
        <option value="Save A Lot">
        <option value="Sunshine Foods">
        <option value="Walmart">
      </datalist>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="toggleAddPanel()">Cancel</button>
      <button class="btn-add" onclick="addNewItem()">Save Item</button>
    </div>
  </div>

  <input type="text" id="searchFilter" class="search-bar" placeholder="🔍 Search pantry, bin location, or store..." oninput="render()">

  <div class="section-title">Pantry, Fridge & Household Inventory</div>
  <div class="grid" id="inventoryGrid"></div>

  <div class="section-title">Generated Shopping List & Budget Calculator</div>
  <div class="shopping-section" id="shoppingSection"></div>

  <script>
    const DEFAULT_GROCERIES = [
      { id: '1', bin: 'A1', name: 'Whole Milk', store: 'Walmart', status: 'plenty', qty: 1, price: 3.50 },
      { id: '2', bin: 'A2', name: 'Eggs', store: 'Walmart', status: 'soon', qty: 2, price: 3.00 },
      { id: '3', bin: 'B1', name: 'Ground Beef 80/20', store: 'Marks Meat Processing', status: 'out', qty: 5, price: 4.50 },
      { id: '4', bin: 'A14', name: 'Flaxseed', store: 'Dutch Country', status: 'out', qty: 1, price: 4.00 },
      { id: '5', bin: 'B2', name: 'Butter', store: 'Walmart', status: 'plenty', qty: 2, price: 4.00 }
    ];

    function safeGetStorage(key) {
      try { return localStorage.getItem(key); } 
      catch (e) { return null; }
    }

    function safeSetStorage(key, value) {
      try { localStorage.setItem(key, value); } 
      catch (e) {}
    }

    function loadInitialItems() {
      const stored = safeGetStorage('grocery_items');
      if (!stored) return [...DEFAULT_GROCERIES];
      try {
        const parsed = JSON.parse(stored);
        return (Array.isArray(parsed) && parsed.length > 0) ? parsed : [...DEFAULT_GROCERIES];
      } catch (e) {
        return [...DEFAULT_GROCERIES];
      }
    }

    let items = loadInitialItems();

    const savedFunds = safeGetStorage('grocery_total_funds');
    if (savedFunds !== null && document.getElementById('totalFunds')) {
      document.getElementById('totalFunds').value = savedFunds;
    }

    function saveFunds() {
      const val = document.getElementById('totalFunds').value;
      safeSetStorage('grocery_total_funds', val);
      render();
    }

    function saveState() {
      safeSetStorage('grocery_items', JSON.stringify(items));
      render();
    }

    function toggleAddPanel() {
      const panel = document.getElementById('addPanel');
      if (panel) {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) {
          document.getElementById('newItemName').focus();
        }
      }
    }

    function addNewItem() {
      const binInput = document.getElementById('newItemBin');
      const nameInput = document.getElementById('newItemName');
      const storeInput = document.getElementById('newItemStore');
      
      if (!nameInput || !nameInput.value.trim()) return;

      const newItem = {
        id: Date.now().toString(),
        bin: binInput.value.trim().toUpperCase(),
        name: nameInput.value.trim(),
        store: storeInput.value.trim() || 'General Store',
        status: 'plenty',
        qty: 1,
        price: 0.00
      };

      items.push(newItem);
      binInput.value = '';
      nameInput.value = '';
      toggleAddPanel();
      saveState();
    }

    function updateItemBin(id, newBin) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.bin = newBin.trim().toUpperCase();
        saveState();
      }
    }

    function deleteItem(id) {
      const item = items.find(i => i.id === id);
      const name = item ? item.name : 'this item';
      if (confirm(`Delete "${name}" permanently?`)) {
        items = items.filter(i => i.id !== id);
        saveState();
      }
    }

    function setStatus(id, newStatus) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.status = newStatus;
        saveState();
      }
    }

    function updateItemCalc(id, field, value) {
      const item = items.find(i => i.id === id);
      if (item) {
        item[field] = parseFloat(value) || 0;
        saveState();
      }
    }

    function exportData() {
      const payload = JSON.stringify({
        items: items,
        funds: document.getElementById('totalFunds').value
      });
      prompt("Copy this backup code:", payload);
    }

    function importData() {
      const code = prompt("Paste your backup code here:");
      if (!code) return;
      try {
        const parsed = JSON.parse(code);
        if (parsed.items && Array.isArray(parsed.items)) {
          items = parsed.items;
          safeSetStorage('grocery_items', JSON.stringify(items));
        }
        if (parsed.funds) {
          safeSetStorage('grocery_total_funds', parsed.funds);
          document.getElementById('totalFunds').value = parsed.funds;
        }
        render();
        alert("Groceries loaded successfully!");
      } catch (e) {
        alert("Invalid code format.");
      }
    }

    function render() {
      const grid = document.getElementById('inventoryGrid');
      if (!grid) return;

      const query = (document.getElementById('searchFilter')?.value || '').toLowerCase();
      
      let filteredItems = items.filter(i => 
        i.name.toLowerCase().includes(query) || 
        i.store.toLowerCase().includes(query) ||
        (i.bin || '').toLowerCase().includes(query)
      );

      const statusPriority = { 'out': 0, 'soon': 1, 'plenty': 2 };

      filteredItems.sort((a, b) => {
        const pA = statusPriority[a.status] ?? 3;
        const pB = statusPriority[b.status] ?? 3;
        if (pA !== pB) return pA - pB;

        const binA = (a.bin || '').trim();
        const binB = (b.bin || '').trim();
        const binCompare = binA.localeCompare(binB, undefined, { numeric: true, sensitivity: 'base' });
        if (binCompare !== 0) return binCompare;

        return (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base' });
      });

      grid.innerHTML = filteredItems.map(item => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="item-title-row">
                <input type="text" class="bin-input" value="${item.bin || ''}" placeholder="BIN" onchange="updateItemBin('${item.id}', this.value)" title="Tap to edit Bin/Location">
                <span class="item-name">${item.name}</span>
              </div>
              <div class="item-store">${item.store}</div>
            </div>
            <button class="btn-delete" onclick="deleteItem('${item.id}')">&times;</button>
          </div>
          <div class="status-group">
            <button class="status-btn ${item.status === 'plenty' ? 'selected-plenty' : ''}" onclick="setStatus('${item.id}', 'plenty')">Plenty</button>
            <button class="status-btn ${item.status === 'soon' ? 'selected-soon' : ''}" onclick="setStatus('${item.id}', 'soon')">Need Soon</button>
            <button class="status-btn ${item.status === 'out' ? 'selected-out' : ''}" onclick="setStatus('${item.id}', 'out')">Out</button>
          </div>
        </div>
      `).join('');

      const shopSection = document.getElementById('shoppingSection');
      if (!shopSection) return;

      const shopItems = items.filter(i => i.status === 'soon' || i.status === 'out');

      if (shopItems.length === 0) {
        shopSection.innerHTML = '<div class="empty-list">All household items are fully stocked! No purchases needed.</div>';
        return;
      }

      const availableFunds = parseFloat(document.getElementById('totalFunds').value) || 0;
      const totalEstSpend = shopItems.reduce((sum, i) => sum + ((i.qty || 1) * (i.price || 0)), 0);
      const remainingBuffer = availableFunds - totalEstSpend;

      const grouped = shopItems.reduce((acc, item) => {
        acc[item.store] = acc[item.store] || [];
        acc[item.store].push(item);
        return acc;
      }, {});

      let html = `
        <div class="budget-summary-bar">
          <div class="summary-item">
            <span class="summary-label">Total Est. Cost</span>
            <span class="summary-val">$${totalEstSpend.toFixed(2)}</span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Remaining Buffer</span>
            <span class="summary-val ${remainingBuffer >= 0 ? 'buffer-positive' : 'buffer-negative'}">$${remainingBuffer.toFixed(2)}</span>
          </div>
        </div>
      `;

      html += Object.keys(grouped).map(store => `
        <div class="vendor-group">
          <div class="vendor-title">📍 ${store}</div>
          <ul class="shop-list">
            ${grouped[store].map(item => `
              <li class="shop-item">
                <input type="checkbox">
                <span class="shop-item-name">${item.bin ? `[${item.bin}] ` : ''}${item.name}</span>
                <span class="badge ${item.status === 'soon' ? 'badge-soon' : 'badge-out'}">${item.status === 'soon' ? 'Soon' : 'Out'}</span>
                
                <div class="price-calc-group">
                  <span class="calc-label">Qty:</span>
                  <input type="number" class="num-input" value="${item.qty || 1}" min="1" onchange="updateItemCalc('${item.id}', 'qty', this.value)">
                  <span class="calc-label">@ $</span>
                  <input type="number" class="num-input num-input-price" value="${(item.price || 0).toFixed(2)}" step="0.50" onchange="updateItemCalc('${item.id}', 'price', this.value)">
                </div>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');

      shopSection.innerHTML = html;
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', render);
    } else {
      render();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
    }
  </script>
</body>
</html>
